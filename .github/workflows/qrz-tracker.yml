name: QRZ Lookup Tracker

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:       # Manual trigger
    inputs:
      simulate:
        description: 'Simulate a failure (verifies the alerting path end-to-end)'
        type: choice
        options: ['none', 'expiry']
        default: 'none'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: qrz-tracker
  cancel-in-progress: false

env:
  # Opt JavaScript actions into Node.js 24 ahead of the 2026-06-02 forced switch
  # so we catch any compatibility issues early. Safe to remove once Node 24 is default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  track-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        id: tracker
        env:
          QRZ_SESSION_TOKEN: ${{ secrets.QRZ_SESSION_TOKEN }}
          QRZ_CALLSIGN: ${{ secrets.QRZ_CALLSIGN }}
          QRZ_SIMULATE: ${{ inputs.simulate }}
        run: |
          set +e
          bash qrzLookupTracker.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        continue-on-error: true

      - name: Create issue on failure
        if: steps.tracker.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.tracker.outputs.exit_code }}
        run: |
          # Exit 2 = session expiry; anything else = unexpected failure (e.g.
          # exit 3, count parse failure). Distinct labels/wording so the issue
          # tells the truth about what actually went wrong.
          if [ "$EXIT_CODE" = "2" ]; then
            LABEL="session-expiry"
            TITLE="QRZ session token expired"
            BODY="The QRZ session token is no longer valid. Update the \`QRZ_SESSION_TOKEN\` secret in repo Settings > Secrets to resume tracking. This issue will auto-close on the next successful run."
            gh label create "$LABEL" --color "d73a4a" --description "QRZ session token needs renewal" 2>/dev/null || true
          else
            LABEL="tracker-failure"
            TITLE="QRZ tracker failed (exit code ${EXIT_CODE:-unknown})"
            BODY="The tracker failed for a reason other than session expiry (exit code ${EXIT_CODE:-unknown}) — likely a page-format change or network error. Check the run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. This issue will auto-close on the next successful run."
            gh label create "$LABEL" --color "e4a11b" --description "QRZ tracker failed for a non-expiry reason" 2>/dev/null || true
          fi
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL"
          fi

      - name: Close failure issues on recovery
        if: steps.tracker.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for label in session-expiry tracker-failure; do
            for num in $(gh issue list --label "$label" --state open --json number --jq '.[].number'); do
              gh issue close "$num" --comment "Tracker recovered; resuming normal runs."
            done
          done

      - name: Commit CSV update
        if: steps.tracker.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: hourly QRZ lookup update"
          git pull --rebase origin main
          git push

      - name: Generate visualizations
        if: steps.tracker.outcome == 'success'
        env:
          QRZ_CALLSIGN: ${{ secrets.QRZ_CALLSIGN }}
        run: python3 qrzHitsViz.py

      - name: Upload Pages artifact
        if: steps.tracker.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.tracker.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
