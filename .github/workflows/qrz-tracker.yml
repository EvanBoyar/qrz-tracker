name: QRZ Lookup Tracker

on:
  schedule:
    # TEMP: once daily during the fetch-rate dose-response test (24x fewer
    # authenticated fetches). If the drip persists, the fetch isn't the cause.
    # Restore to '0 * * * *' (hourly) when the test concludes.
    - cron: '0 6 * * *'  # Once daily at 06:00 UTC
  workflow_dispatch:       # Manual trigger
    inputs:
      simulate:
        description: 'Simulate a failure (verifies the alerting path end-to-end)'
        type: choice
        options: ['none', 'expiry']
        default: 'none'
      mode:
        description: 'Run mode (isolation experiments; scheduled runs use the TRACKER_MODE repo variable)'
        type: choice
        options: ['', 'normal', 'fetch-only', 'publish-only']
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: qrz-tracker
  cancel-in-progress: false

env:
  # Opt JavaScript actions into Node.js 24 ahead of the 2026-06-02 forced switch
  # so we catch any compatibility issues early. Safe to remove once Node 24 is default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  track-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Isolation-experiment switch (see plans/qrz contingency plan):
      #   normal       - fetch QRZ + commit CSV + deploy (default)
      #   fetch-only   - fetch QRZ, publish NOTHING (no commit/deploy; reading -> artifact)
      #   publish-only - NO QRZ contact; heartbeat commit + deploy only
      # Dispatch input wins; scheduled runs follow the TRACKER_MODE repo variable.
      - name: Resolve run mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          VAR_MODE: ${{ vars.TRACKER_MODE }}
        run: |
          MODE="${INPUT_MODE:-${VAR_MODE:-normal}}"
          case "$MODE" in normal|fetch-only|publish-only) ;; *) MODE=normal ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Run mode: $MODE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        id: tracker
        if: steps.mode.outputs.mode != 'publish-only'
        env:
          QRZ_SESSION_TOKEN: ${{ secrets.QRZ_SESSION_TOKEN }}
          QRZ_CALLSIGN: ${{ secrets.QRZ_CALLSIGN }}
          QRZ_SIMULATE: ${{ inputs.simulate }}
        run: |
          set +e
          bash qrzLookupTracker.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        continue-on-error: true

      - name: Create issue on failure
        if: steps.tracker.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.tracker.outputs.exit_code }}
        run: |
          # Exit 2 = session expiry; anything else = unexpected failure (e.g.
          # exit 3, count parse failure). Distinct labels/wording so the issue
          # tells the truth about what actually went wrong.
          if [ "$EXIT_CODE" = "2" ]; then
            LABEL="session-expiry"
            TITLE="QRZ session token expired"
            BODY="The QRZ session token is no longer valid. Update the \`QRZ_SESSION_TOKEN\` secret in repo Settings > Secrets to resume tracking. This issue will auto-close on the next successful run."
            gh label create "$LABEL" --color "d73a4a" --description "QRZ session token needs renewal" 2>/dev/null || true
          else
            LABEL="tracker-failure"
            TITLE="QRZ tracker failed (exit code ${EXIT_CODE:-unknown})"
            BODY="The tracker failed for a reason other than session expiry (exit code ${EXIT_CODE:-unknown}) — likely a page-format change or network error. Check the run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. This issue will auto-close on the next successful run."
            gh label create "$LABEL" --color "e4a11b" --description "QRZ tracker failed for a non-expiry reason" 2>/dev/null || true
          fi
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABEL"
          fi

      - name: Close failure issues on recovery
        if: steps.tracker.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for label in session-expiry tracker-failure; do
            for num in $(gh issue list --label "$label" --state open --json number --jq '.[].number'); do
              gh issue close "$num" --comment "Tracker recovered; resuming normal runs."
            done
          done

      # fetch-only: the reading leaves the runner ONLY as an artifact. No commit,
      # no deploy, no public GitHub event for scraper fleets to react to.
      - name: Upload reading artifact (fetch-only)
        if: steps.mode.outputs.mode == 'fetch-only' && steps.tracker.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reading-${{ github.run_id }}
          path: '*.csv'
          retention-days: 14

      - name: Commit CSV update
        if: steps.mode.outputs.mode == 'normal' && steps.tracker.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: hourly QRZ lookup update"
          git pull --rebase origin main
          git push

      # publish-only: produce the same public GitHub activity as a real run
      # (a push + a Pages deploy) while never contacting qrz.com.
      - name: Heartbeat commit (publish-only)
        if: steps.mode.outputs.mode == 'publish-only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "data: hourly QRZ lookup update"
          git pull --rebase origin main
          git push

      - name: Generate visualizations
        if: (steps.mode.outputs.mode == 'normal' && steps.tracker.outcome == 'success') || steps.mode.outputs.mode == 'publish-only'
        env:
          QRZ_CALLSIGN: ${{ secrets.QRZ_CALLSIGN }}
        run: python3 qrzHitsViz.py

      - name: Upload Pages artifact
        if: (steps.mode.outputs.mode == 'normal' && steps.tracker.outcome == 'success') || steps.mode.outputs.mode == 'publish-only'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: (steps.mode.outputs.mode == 'normal' && steps.tracker.outcome == 'success') || steps.mode.outputs.mode == 'publish-only'
        id: deploy
        uses: actions/deploy-pages@v4
